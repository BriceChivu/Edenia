name: Discover language-learning channels

on:
  schedule:
    - cron: '29 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: channel-catalog-maintenance
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Search for language-learning channels
        env:
          YOUTUBE_CATALOG_API_KEY: ${{ secrets.YOUTUBE_CATALOG_API_KEY }}
          DISCOVERY_MAX_PER_LANGUAGE: ${{ vars.DISCOVERY_MAX_PER_LANGUAGE }}
          DISCOVERY_MIN_SUBSCRIBERS: ${{ vars.DISCOVERY_MIN_SUBSCRIBERS }}
          DISCOVERY_MIN_VIDEOS: ${{ vars.DISCOVERY_MIN_VIDEOS }}
        run: node scripts/discover-language-channels.mjs

      - name: Publish discovery review branch
        run: |
          node scripts/publish-maintenance-branch.mjs \
            --branch "automation/discover-language-channels-${{ github.run_id }}-${{ github.run_attempt }}" \
            --commit-message "Discover language-learning channels" \
            --path data/channel-catalog.discovered.json

name: Refresh channel catalog

on:
  push:
    branches:
      - master
    paths:
      - data/channel-catalog.source.json
      - scripts/refresh-channel-catalog.mjs
      - .github/workflows/refresh-channel-catalog.yml
  schedule:
    - cron: '17 3 1,15 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: channel-catalog-maintenance
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh YouTube metadata
        env:
          YOUTUBE_CATALOG_API_KEY: ${{ secrets.YOUTUBE_CATALOG_API_KEY }}
        run: |
          if [ -z "$YOUTUBE_CATALOG_API_KEY" ]; then
            echo "Missing required repository secret: YOUTUBE_CATALOG_API_KEY" >&2
            exit 1
          fi

          node scripts/refresh-channel-catalog.mjs

      - name: Commit refreshed catalog
        run: |
          if git diff --quiet -- data/channel-catalog.json; then
            echo "Channel catalog is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/channel-catalog.json
          git commit -m "Refresh channel catalog metadata"
          git push

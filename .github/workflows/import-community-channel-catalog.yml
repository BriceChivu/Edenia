name: Import community channel catalog

on:
  schedule:
    - cron: '43 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: channel-catalog-maintenance
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Import and verify community candidates
        env:
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          YOUTUBE_CATALOG_API_KEY: ${{ secrets.YOUTUBE_CATALOG_API_KEY }}
        run: node scripts/import-community-channel-candidates.mjs

      - name: Publish community catalog review branch
        run: |
          node scripts/publish-maintenance-branch.mjs \
            --branch "automation/import-community-channel-catalog-${{ github.run_id }}-${{ github.run_attempt }}" \
            --commit-message "Update community channel catalog" \
            --path data/channel-catalog.candidates.json \
            --path data/channel-catalog.community.json

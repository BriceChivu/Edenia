name: Import community channel catalog

on:
  schedule:
    - cron: '43 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: channel-catalog-maintenance
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Import and verify community candidates
        env:
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          YOUTUBE_CATALOG_API_KEY: ${{ secrets.YOUTUBE_CATALOG_API_KEY }}
        run: node scripts/import-community-channel-candidates.mjs

      - name: Commit catalog changes
        run: |
          if git diff --quiet -- data/channel-catalog.candidates.json data/channel-catalog.community.json; then
            echo "Community catalog is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/channel-catalog.candidates.json data/channel-catalog.community.json
          git commit -m "Update community channel catalog"
          git push

name: Temporary Linux WebKit input probe
on:
  pull_request:
    paths:
      - '.github/workflows/storage-ci-probe.yml'
      - 'tests/e2e/history-chart.spec.mjs'
permissions:
  contents: read
  actions: read
concurrency:
  group: storage-ci-probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  chart-input:
    if: github.event.pull_request.number == 475
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: ci-site-normal
          run-id: 38681603201
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: _site
      - run: npx playwright install --with-deps webkit
      - name: Inspect native drag delivery
        env:
          EDENIA_TEST_BASE_PATH: /Edenia/
          EDENIA_CHART_PROBE: '1'
        run: npx playwright test history-chart.spec.mjs --project=webkit-trial-desktop --project=webkit-trial-phone --grep='Market navigator groups' --reporter=line

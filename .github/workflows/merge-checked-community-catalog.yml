name: Merge checked community catalog

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - automation/import-community-channel-catalog

permissions:
  contents: read

concurrency:
  group: merge-checked-community-catalog
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.pull_requests[0].number
    runs-on: ubuntu-latest

    steps:
      - name: Create catalog automation token
        id: catalog-app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CATALOG_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.CATALOG_AUTOMATION_PRIVATE_KEY }}

      - name: Checkout trusted merge helper
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Merge the exact catalog revision that passed CI
        env:
          GH_TOKEN: ${{ steps.catalog-app.outputs.token }}
          COMMUNITY_CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          COMMUNITY_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          COMMUNITY_PR_BASE_SHA: ${{ github.event.workflow_run.pull_requests[0].base.sha }}
          COMMUNITY_PR_HEAD_SHA: ${{ github.event.workflow_run.pull_requests[0].head.sha }}
        run: node scripts/merge-checked-community-pull-request.mjs

name: Learner profile disaster backup

on:
  schedule:
    - cron: '17 4 * * 0'
  workflow_dispatch:
    inputs:
      recover_capacity:
        description: 'Apply the reviewed 100-version batch migration and reclaim profile table space for the October 9 capacity incident'
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: learner-profile-disaster-backup
  cancel-in-progress: false

jobs:
  backup:
    if: ${{ !inputs.recover_capacity }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - name: Check database URL secret
        shell: bash
        run: test -n "$SUPABASE_DB_URL"

      - name: Create external logical dump
        id: dump
        shell: bash
        run: |
          set -euo pipefail

          backup_dir="$RUNNER_TEMP/edenia-database-backup"
          archive="$RUNNER_TEMP/edenia-database-backup.tar.gz"
          mkdir -p "$backup_dir"

          supabase db dump \
            --db-url "$SUPABASE_DB_URL" \
            --file "$backup_dir/schema.sql"
          supabase db dump \
            --db-url "$SUPABASE_DB_URL" \
            --data-only \
            --use-copy \
            --file "$backup_dir/data.sql"
          (
            cd "$backup_dir"
            sha256sum schema.sql data.sql > SHA256SUMS
          )
          tar -czf "$archive" \
            -C "$backup_dir" \
            schema.sql data.sql SHA256SUMS
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload external dump
        if: always() && steps.dump.outputs.archive != ''
        uses: actions/upload-artifact@v4
        with:
          name: edenia-database-backup-${{ github.run_id }}
          path: ${{ steps.dump.outputs.archive }}
          if-no-files-found: error
          retention-days: 35

      - name: Start isolated restore database
        if: vars.EDENIA_AUTH_EXPERIMENT_ENABLED == 'true'
        shell: bash
        run: |
          set -euo pipefail

          restore_project="$RUNNER_TEMP/edenia-restore-project"
          supabase init --workdir "$restore_project" > /dev/null
          restore_project="$(cd "$restore_project" && pwd -P)"
          supabase start \
            --workdir "$restore_project" \
            --exclude realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor \
            > /dev/null 2>&1

      - name: Restore dump into isolated database
        if: vars.EDENIA_AUTH_EXPERIMENT_ENABLED == 'true'
        shell: bash
        run: |
          set -euo pipefail

          archive="${{ steps.dump.outputs.archive }}"
          restore_dir="$RUNNER_TEMP/edenia-database-restore"
          restore_project="$RUNNER_TEMP/edenia-restore-project"
          restore_project="$(cd "$restore_project" && pwd -P)"
          mkdir -p "$restore_dir"
          tar -xzf "$archive" -C "$restore_dir"
          (
            cd "$restore_dir"
            sha256sum -c SHA256SUMS
          )

          restore_db_url="$(
            supabase status --workdir "$restore_project" -o json 2>/dev/null |
              jq -er '.DB_URL
                | select(test("^postgres(?:ql)?://postgres:"))
                | sub("://postgres:"; "://supabase_admin:")'
          )"
          # Auth must apply its managed migrations, then stay stopped while real
          # identities and sessions are loaded into the disposable database.
          restore_auth_container="$(docker ps \
            --filter "label=com.supabase.cli.workdir=$restore_project" \
            --filter 'name=supabase_auth_' --format '{{.ID}}')"
          [[ "$restore_auth_container" =~ ^[a-f0-9]+$ ]]
          docker stop "$restore_auth_container" > /dev/null
          test "$(psql "$restore_db_url" -At --variable ON_ERROR_STOP=1 \
            --command "select to_regclass('auth.mfa_recovery_code_sets') is not null;")" = 't'
          psql "$restore_db_url" \
            --single-transaction \
            --variable ON_ERROR_STOP=1 \
            --file "$restore_dir/schema.sql" \
            --command 'SET session_replication_role = replica' \
            --file "$restore_dir/data.sql" \
            > /dev/null
          psql "$restore_db_url" \
            --csv \
            --variable ON_ERROR_STOP=1 \
            --command "select count(*) as profile_heads, (select count(*) from public.learner_profile_versions) as profile_versions from public.learner_profile_heads;"
          unset restore_db_url

      - name: Stop isolated restore database
        if: always() && vars.EDENIA_AUTH_EXPERIMENT_ENABLED == 'true'
        shell: bash
        run: supabase stop --workdir "$RUNNER_TEMP/edenia-restore-project" --no-backup > /dev/null 2>&1 || true

      - name: Record capacity evidence and run guarded retention
        if: vars.EDENIA_AUTH_EXPERIMENT_ENABLED == 'true'
        shell: bash
        run: |
          set -euo pipefail

          capacity_status="$(psql "$SUPABASE_DB_URL" -At -c \
            "select capacity_status from private.record_learner_profile_capacity_check();")"
          printf 'Capacity status: %s\n' "$capacity_status"

          maintenance_status="$(psql "$SUPABASE_DB_URL" -At -c \
            "select status from private.run_learner_profile_maintenance(null, true);")"
          printf 'Retention maintenance status: %s\n' "$maintenance_status"

          case "$capacity_status" in
            warning)
              echo '::warning::Learner profile database usage reached the configured warning threshold.'
              ;;
            pause)
              echo '::error::Learner profile database usage remains above the configured capacity threshold; inspect allocated disk space after retention.'
              exit 1
              ;;
          esac

  capacity-recovery:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.recover_capacity }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: '15'
      PGOPTIONS: '-c lock_timeout=5s -c statement_timeout=180s'
    steps:
      - name: Checkout reviewed recovery source
        uses: actions/checkout@v4
      - name: Drain the Free backlog through one direct database session
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL"
          python3 - <<'PY'
          import os
          from pathlib import Path
          migration = Path('supabase/migrations/20261009152958_tune_free_retention_batch_size.sql').read_text()
          delimiter = '$edenia_retention_migration$'
          assert delimiter not in migration
          sql = 'begin;\n' + migration
          sql += "\ninsert into supabase_migrations.schema_migrations (version, name, statements) values ('20261009152958', 'tune_free_retention_batch_size', array[" + delimiter + migration + delimiter + "]::text[]) on conflict (version) do nothing;\n"
          sql += "select cron.alter_job(jobid, active := false) from cron.job where jobname = 'edenia-learner-profile-retention';\ncommit;\n"
          recovery_migration = Path('supabase/migrations/20261009172000_bound_free_recovery_batches.sql').read_text()
          sql += 'begin;\n' + recovery_migration
          sql += "\ninsert into supabase_migrations.schema_migrations (version, name, statements) values ('20261009172000', 'bound_free_recovery_batches', array[" + delimiter + recovery_migration + delimiter + " ]::text[]) on conflict (version) do nothing;\ncommit;\n"
          source = Path('supabase/migrations/20261009150230_reduce_write_amplification_and_restore_retention.sql').read_text()
          start = source.index('  protected_version_ids as (')
          end = source.index('  version_metrics as (', start)
          protected = source[start:end].strip().rstrip(',').replace('p_owner_id', 'null::uuid')
          sql += 'create temporary table retention_protected_before as with ' + protected
          sql += ' select version.id, version.payload_sha256 from protected_version_ids protected join public.learner_profile_versions version on version.id = protected.version_id and version.user_id = protected.user_id;\n'
          sql += "select private.record_learner_profile_capacity_check();\nset edenia.retention_batch_limit = '5';\n"
          sql += r'\set has_backlog true' + '\n'
          for _ in range(400):
              sql += r"""
          \if :has_backlog
          select status = 'applied' as applied, deleted_ordinary_versions as deleted,
            ordinary_prunable_version_count as remaining,
            ordinary_prunable_version_count > 0 as has_backlog
          from private.run_learner_profile_maintenance(null, true)
          \gset
          \if :applied
          \echo Retention deleted=:deleted remaining=:remaining
          \else
          do $$ begin raise exception 'Capacity recovery check failed'; end $$;
          \endif
          \endif
          """
          sql += r"""
          \if :has_backlog
          do $$ begin raise exception 'Capacity recovery check failed'; end $$;
          \endif
          -- Copy only the retained set after draining; copying the backlog itself
          -- exhausted the Free project's memory and compaction time budget.
          set statement_timeout = '600s';
          VACUUM (FULL, ANALYZE) public.learner_profile_versions;
          set statement_timeout = '180s';
          select count(*) = count(version.id)
            and bool_and(version.payload_sha256 = baseline.payload_sha256) as protected_intact
          from retention_protected_before baseline
          left join public.learner_profile_versions version on version.id = baseline.id
          \gset
          \if :protected_intact
          \echo Protected versions retained with unchanged hashes
          \else
          do $$ begin raise exception 'Capacity recovery check failed'; end $$;
          \endif
          select cron.alter_job(jobid, active := true) from cron.job where jobname = 'edenia-learner-profile-retention';
          select capacity_status, database_size_bytes, version_count,
            protected_version_count, ordinary_prunable_version_count
          from private.record_learner_profile_capacity_check();
          """
          Path(os.environ['RUNNER_TEMP'], 'edenia-capacity-recovery.sql').write_text(sql)
          PY
          psql "$SUPABASE_DB_URL" --variable ON_ERROR_STOP=1 \
            --file "$RUNNER_TEMP/edenia-capacity-recovery.sql"
      - name: Restore scheduled retention after recovery
        if: always()
        shell: bash
        run: |
          psql "$SUPABASE_DB_URL" --variable ON_ERROR_STOP=1 \
            --command "select cron.alter_job(jobid, active := true) from cron.job where jobname = 'edenia-learner-profile-retention';"

name: Auth health monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auth-health-monitor
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Check required runtime values
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_PUBLISHABLE_KEY"
          test -n "$SUPABASE_DB_URL"

      - name: Probe Auth and record aggregate health
        run: node scripts/check-auth-health.mjs

      - name: Emit an actionable monitor-failure annotation
        if: failure()
        run: |
          echo '::error title=Edenia Auth health monitor failure::The scheduled Auth health monitor failed. Inspect the sanitized probe diagnostic, verify the deployed monitoring schema and runtime configuration, and keep the profile-data gate disabled until a successful probe records aggregate health.'

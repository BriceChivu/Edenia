name: Auth health monitor watchdog

on:
  schedule:
    # Secondary stale-record watchdog only. The independent external monitor is
    # the production five-minute clock and operator alert path.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auth-health-monitor-watchdog
  cancel-in-progress: true

jobs:
  freshness:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      EDENIA_AUTH_MONITOR_TOKEN: ${{ secrets.EDENIA_AUTH_MONITOR_TOKEN }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Check aggregate monitor freshness
        run: node scripts/check-auth-health-freshness.mjs

      - name: Emit an actionable stale-monitor annotation
        if: failure()
        run: |
          echo '::error title=Edenia Auth monitor is stale or unavailable::The secondary watchdog could not verify a fresh healthy aggregate record. Check the independent external monitor and its operator notification first; keep the profile-data gate disabled until a successful external probe records healthy aggregate state.'

  manual-probe:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Check required runtime values
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_PUBLISHABLE_KEY"
          test -n "$SUPABASE_DB_URL"

      - name: Probe Auth and record aggregate health
        run: node scripts/check-auth-health.mjs

      - name: Emit an actionable manual-probe annotation
        if: failure()
        run: |
          echo '::error title=Edenia manual Auth health probe failed::Inspect the sanitized probe diagnostic, verify the deployed monitoring schema and runtime configuration, and keep the profile-data gate disabled until the independent external monitor records healthy aggregate state.'

name: CI

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine test scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail

          run_contracts=false
          run_browser=false
          run_catalogs=false
          run_supabase=false
          run_supabase_db=false
          run_discovery_catalog=false
          run_community_catalog=false

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            run_contracts=true
            run_browser=true
            run_catalogs=true
            run_supabase=true
            run_supabase_db=true
          else
            mapfile -t changed_files < <(git diff --name-only "$BASE_SHA" HEAD)
            printf 'Changed files:\n'
            printf '  %s\n' "${changed_files[@]}"

            for file in "${changed_files[@]}"; do
              case "$file" in
                .github/workflows/ci.yml|.github/workflows/import-community-channel-catalog.yml|.github/workflows/merge-checked-community-catalog.yml|.github/workflows/merge-checked-discovery-catalog.yml)
                  run_contracts=true
                  run_supabase=true
                  ;;
                .github/workflows/discover-language-channels.yml|scripts/discover-language-channels.mjs|scripts/validate-discovered-channel-catalog.mjs)
                  run_catalogs=true
                  run_contracts=true
                  ;;
                *.md|docs/*|.github/*)
                  ;;
                data/channel-catalog.discovered.json)
                  run_catalogs=true
                  run_discovery_catalog=true
                  ;;
                data/channel-catalog.candidates.json|data/channel-catalog.community.json)
                  run_catalogs=true
                  run_community_catalog=true
                  ;;
                data/channel-catalog*.json|images/channel-avatars/*)
                  run_catalogs=true
                  ;;
                data/reminder-discovery-channels.json|scripts/validate-reminder-discovery-channels.mjs)
                  run_catalogs=true
                  run_contracts=true
                  ;;
                scripts/validate-channel-catalog-json.mjs|scripts/validate-community-channel-catalog.mjs|scripts/community-channel-catalog-policy.mjs)
                  run_catalogs=true
                  run_contracts=true
                  ;;
                tests/contracts/*)
                  run_contracts=true
                  ;;
                supabase/migrations/*_create_first_signed_in_profile.sql|supabase/tests/first_signed_in_profile.test.sql|supabase/migrations/*_add_reminder_preferences.sql|supabase/migrations/*_replace_schedule_with_email_types.sql|supabase/tests/reminder_preferences_rls.test.sql|supabase/migrations/*_add_reminder_eligibility_snapshots.sql|supabase/tests/reminder_eligibility_snapshots.test.sql|supabase/migrations/*_add_reminder_dispatch_ledger.sql|supabase/tests/reminder_dispatch_ledger.test.sql|supabase/migrations/*_add_reminder_suppression_safety.sql|supabase/tests/reminder_suppression_safety.test.sql|supabase/migrations/*_add_reminder_provider_delivery_state.sql|supabase/tests/reminder_provider_delivery_state.test.sql|supabase/migrations/*_fence_live_reminder_prerequisites.sql|supabase/tests/reminder_live_prerequisites.test.sql|supabase/migrations/*_add_reminder_provider_event_ledger.sql|supabase/migrations/*_add_reminder_operational_metrics.sql|supabase/tests/reminder_provider_event_ledger.test.sql|supabase/migrations/*_add_typed_reminder_dry_run.sql|supabase/tests/typed_reminder_dry_run.test.sql|supabase/migrations/*_add_typed_reminder_live_canary.sql|supabase/tests/typed_reminder_live_canary.test.sql|supabase/migrations/*_optimize_account_owner_policies.sql|supabase/tests/account_owner_policies.test.sql|supabase/migrations/*_add_self_scoped_account_export.sql|supabase/migrations/*_hide_account_export_definer.sql|supabase/tests/account_server_data_export.test.sql|supabase/migrations/*_ensure_account_export_rate_limit.sql|supabase/tests/account_export_rate_limit.test.sql|supabase/migrations/*_ensure_stripe_webhook_prerequisites.sql|supabase/tests/stripe_webhook_prerequisites.test.sql|supabase/migrations/*_reconcile_plus_backup_grace_policies.sql|supabase/tests/plus_backup_grace_policies.test.sql|supabase/migrations/*_legacy_progress_transfer_relay.sql|supabase/tests/legacy_progress_transfer_relay.test.sql)
                  run_supabase=true
                  run_supabase_db=true
                  ;;
                supabase/*)
                  run_supabase=true
                  ;;
                *)
                  run_contracts=true
                  run_browser=true
                  ;;
              esac
            done
          fi

          echo "contracts=$run_contracts" >> "$GITHUB_OUTPUT"
          echo "browser=$run_browser" >> "$GITHUB_OUTPUT"
          echo "catalogs=$run_catalogs" >> "$GITHUB_OUTPUT"
          echo "supabase=$run_supabase" >> "$GITHUB_OUTPUT"
          echo "supabase_db=$run_supabase_db" >> "$GITHUB_OUTPUT"
          echo "discovery_catalog=$run_discovery_catalog" >> "$GITHUB_OUTPUT"
          echo "community_catalog=$run_community_catalog" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.scope.outputs.contracts == 'true' || steps.scope.outputs.catalogs == 'true' || steps.scope.outputs.supabase == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        if: steps.scope.outputs.contracts == 'true'
        run: npm ci

      - name: Validate channel catalogs
        if: steps.scope.outputs.catalogs == 'true'
        run: npm run test:catalogs

      - name: Validate unattended discovery delta
        if: steps.scope.outputs.discovery_catalog == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DISCOVERY_MAX_TOTAL_ADDITIONS: ${{ vars.DISCOVERY_MAX_TOTAL_ADDITIONS }}
          DISCOVERY_MIN_SUBSCRIBERS: ${{ vars.DISCOVERY_MIN_SUBSCRIBERS }}
          DISCOVERY_MIN_VIDEOS: ${{ vars.DISCOVERY_MIN_VIDEOS }}
        run: npm run test:catalogs:discovery -- --base-ref "$BASE_SHA"

      - name: Validate unattended community delta
        if: steps.scope.outputs.community_catalog == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          COMMUNITY_CATALOG_MAX_PROMOTIONS: ${{ vars.COMMUNITY_CATALOG_MAX_PROMOTIONS }}
        run: npm run test:catalogs:community -- --base-ref "$BASE_SHA"

      - name: Build and run contract tests
        if: steps.scope.outputs.contracts == 'true'
        run: npm run build && npm run test:contracts

      - name: Run Supabase backend tests
        if: steps.scope.outputs.supabase == 'true'
        run: npm run test:supabase

      - name: Set up Deno for Edge Function checks
        if: steps.scope.outputs.supabase == 'true'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.4

      - name: Type-check reminder Edge Function
        if: steps.scope.outputs.supabase == 'true'
        run: npm run test:reminder-function

      - name: Type-check account export Edge Function
        if: steps.scope.outputs.supabase == 'true'
        run: npm run test:account-export-function

      - name: Type-check legacy progress relay Edge Functions
        if: steps.scope.outputs.supabase == 'true'
        run: npm run test:legacy-progress-relay-function

      - name: Set up Supabase CLI
        if: steps.scope.outputs.supabase_db == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Start isolated Supabase database
        if: steps.scope.outputs.supabase_db == 'true'
        run: supabase start

      - name: Verify database safety
        if: steps.scope.outputs.supabase_db == 'true'
        run: |
          supabase test db supabase/tests/first_signed_in_profile.test.sql --local
          supabase test db supabase/tests/reminder_preferences_rls.test.sql --local
          supabase test db supabase/tests/reminder_eligibility_snapshots.test.sql --local
          supabase test db supabase/tests/reminder_dispatch_ledger.test.sql --local
          supabase test db supabase/tests/reminder_suppression_safety.test.sql --local
          supabase test db supabase/tests/reminder_provider_delivery_state.test.sql --local
          supabase test db supabase/tests/reminder_live_prerequisites.test.sql --local
          supabase test db supabase/tests/reminder_provider_event_ledger.test.sql --local
          supabase test db supabase/tests/typed_reminder_dry_run.test.sql --local
          supabase test db supabase/tests/typed_reminder_live_canary.test.sql --local
          supabase test db supabase/tests/account_owner_policies.test.sql --local
          supabase test db supabase/tests/account_server_data_export.test.sql --local
          supabase test db supabase/tests/account_export_rate_limit.test.sql --local
          supabase test db supabase/tests/stripe_webhook_prerequisites.test.sql --local
          supabase test db supabase/tests/plus_backup_grace_policies.test.sql --local
          supabase test db supabase/tests/legacy_progress_transfer_relay.test.sql --local

      - name: Stop isolated Supabase database
        if: always() && steps.scope.outputs.supabase_db == 'true'
        run: supabase stop --no-backup

      - name: Install Playwright browsers
        if: steps.scope.outputs.browser == 'true'
        run: npx playwright install --with-deps chromium webkit

      - name: Run browser tests
        if: steps.scope.outputs.browser == 'true'
        env:
          EDENIA_TEST_NORMAL_PORT: 4173
        run: npx playwright test

      - name: Report skipped suites
        if: steps.scope.outputs.contracts != 'true' && steps.scope.outputs.catalogs != 'true' && steps.scope.outputs.supabase != 'true' && steps.scope.outputs.supabase_db != 'true'
        run: echo "Documentation or workflow-only change; no automated test suite required."

      - name: Upload Playwright diagnostics
        if: failure() && steps.scope.outputs.browser == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

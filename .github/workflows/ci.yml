name: CI

on:
  pull_request:
    branches: [master]
  schedule:
    - cron: '23 20 * * *'
  workflow_dispatch:
    inputs:
      benchmark:
        description: 'Full regression or a measured representative feed-CSS scope (manual runs only)'
        type: choice
        options: [full, feed-css]
        default: full

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      contracts: ${{ steps.scope.outputs.contracts }}
      browser: ${{ steps.scope.outputs.browser }}
      game: ${{ steps.scope.outputs.game }}
      build: ${{ steps.scope.outputs.build }}
      catalogs: ${{ steps.scope.outputs.catalogs }}
      supabase: ${{ steps.scope.outputs.supabase }}
      supabase_db: ${{ steps.scope.outputs.supabase_db }}
      discovery_catalog: ${{ steps.scope.outputs.discovery_catalog }}
      community_catalog: ${{ steps.scope.outputs.community_catalog }}
      full_matrix: ${{ steps.scope.outputs.full_matrix }}
      browser_files: ${{ steps.scope.outputs.browser_files }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Determine test scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_BENCHMARK: ${{ inputs.benchmark }}
        run: node scripts/ci-scope.mjs

  build:
    needs: scope
    if: needs.scope.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/setup-godot
      - name: Build shared sites and validate the game once when selected
        run: node scripts/build-ci-sites.mjs
        env:
          EDENIA_CI_GAME: ${{ needs.scope.outputs.game }}
          EDENIA_VALIDATE_GAME: ${{ needs.scope.outputs.game }}
      - uses: actions/upload-artifact@v4
        with:
          name: ci-site-normal
          path: .cache/ci-sites/normal
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: ci-migration-helper
          path: .cache/ci-sites/migration-helper
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: needs.scope.outputs.game == 'true'
        with:
          name: ci-site-integrated
          path: .cache/ci-sites/integrated
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: needs.scope.outputs.game == 'true'
        with:
          name: ci-site-public
          path: .cache/ci-sites/public
          retention-days: 1
          compression-level: 0

  checks:
    needs: [scope, build]
    if: ${{ !cancelled() && needs.scope.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        if: needs.scope.outputs.contracts == 'true' || needs.scope.outputs.catalogs == 'true' || needs.scope.outputs.supabase == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        if: needs.scope.outputs.contracts == 'true' || needs.scope.outputs.supabase == 'true'
        run: npm ci

      - name: Validate channel catalogs
        if: needs.scope.outputs.catalogs == 'true'
        run: npm run test:catalogs

      - name: Validate unattended discovery delta
        if: needs.scope.outputs.discovery_catalog == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DISCOVERY_MAX_TOTAL_ADDITIONS: ${{ vars.DISCOVERY_MAX_TOTAL_ADDITIONS }}
          DISCOVERY_MIN_SUBSCRIBERS: ${{ vars.DISCOVERY_MIN_SUBSCRIBERS }}
          DISCOVERY_MIN_VIDEOS: ${{ vars.DISCOVERY_MIN_VIDEOS }}
        run: npm run test:catalogs:discovery -- --base-ref "$BASE_SHA"

      - name: Validate unattended community delta
        if: needs.scope.outputs.community_catalog == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          COMMUNITY_CATALOG_MAX_PROMOTIONS: ${{ vars.COMMUNITY_CATALOG_MAX_PROMOTIONS }}
        run: npm run test:catalogs:community -- --base-ref "$BASE_SHA"

      - name: Download shared normal site
        if: needs.scope.outputs.contracts == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ci-site-normal
          path: _site

      - name: Download shared migration helper
        if: needs.scope.outputs.contracts == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ci-migration-helper
          path: _legacy_migration_site

      - name: Run contract tests
        if: needs.scope.outputs.contracts == 'true'
        run: npm run test:contracts

      - name: Run Supabase backend tests
        if: needs.scope.outputs.supabase == 'true'
        run: npm run test:supabase

      - name: Set up Deno for Edge Function checks
        if: needs.scope.outputs.supabase == 'true'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.4

      - name: Type-check Auth monitor Edge Function
        if: needs.scope.outputs.supabase == 'true'
        run: npm run test:auth-monitor-function

      - name: Type-check reminder Edge Function
        if: needs.scope.outputs.supabase == 'true'
        run: npm run test:reminder-function

      - name: Type-check account export Edge Function
        if: needs.scope.outputs.supabase == 'true'
        run: npm run test:account-export-function

      - name: Type-check legacy progress relay Edge Functions
        if: needs.scope.outputs.supabase == 'true'
        run: npm run test:legacy-progress-relay-function

      - name: Set up Supabase CLI
        if: needs.scope.outputs.supabase_db == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Start isolated Supabase database
        if: needs.scope.outputs.supabase_db == 'true'
        run: supabase start

      - name: Verify database safety
        if: needs.scope.outputs.supabase_db == 'true'
        run: |
          node scripts/generate-owned-profile-contract-fixtures.mjs
          node scripts/generate-reminder-policy-fixtures.mjs
          supabase test db .cache/current-experience-owned-profile.test.sql --local
          supabase test db .cache/stale-generation-island-conflict.test.sql --local
          supabase test db .cache/auth-trial-admission.test.sql --local
          supabase test db supabase/tests/pixel_town_economy.test.sql --local
          supabase test db supabase/tests/first_signed_in_profile.test.sql --local
          supabase test db supabase/tests/learner_profile_progress_sync.test.sql --local
          supabase test db supabase/tests/conditional_profile_opening.test.sql --local
          supabase test db supabase/tests/learner_profile_handoff.test.sql --local
          supabase test db supabase/tests/learner_profile_records.test.sql --local
          supabase test db supabase/tests/learner_profile_conflict_resolution.test.sql --local
          supabase test db supabase/tests/voluntary_accountless_profile_migration.test.sql --local
          supabase test db supabase/tests/learner_profile_recovery.test.sql --local
          supabase test db supabase/tests/learner_profile_import.test.sql --local
          supabase test db supabase/tests/learner_profile_start_over.test.sql --local
          supabase test db supabase/tests/learner_profile_retention.test.sql --local
          supabase test db supabase/tests/auth_operations.test.sql --local
          supabase test db supabase/tests/auth_monitoring_freshness.test.sql --local
          supabase test db .cache/reminder-policy-fixtures.test.sql --local
          supabase test db supabase/tests/accepted_reminder_eligibility.test.sql --local
          supabase test db supabase/tests/reminder_scheduler_inert.test.sql --local
          supabase test db supabase/tests/free_reminder_dispatch.test.sql --local
          supabase test db supabase/tests/reminder_provider_month_capacity.test.sql --local
          supabase test db supabase/tests/reminder_capacity_fairness.test.sql --local
          supabase test db supabase/tests/reminder_final_fences.test.sql --local
          supabase test db supabase/tests/reminder_time_windows.test.sql --local
          supabase test db supabase/tests/reminder_discovery_edges.test.sql --local
          supabase test db supabase/tests/reminder_preferences_rls.test.sql --local
          supabase test db supabase/tests/reminder_eligibility_snapshots.test.sql --local
          supabase test db supabase/tests/reminder_dispatch_ledger.test.sql --local
          supabase test db supabase/tests/reminder_suppression_safety.test.sql --local
          supabase test db supabase/tests/reminder_provider_delivery_state.test.sql --local
          supabase test db supabase/tests/reminder_live_prerequisites.test.sql --local
          supabase test db supabase/tests/reminder_provider_event_ledger.test.sql --local
          supabase test db supabase/tests/typed_reminder_dry_run.test.sql --local
          supabase test db supabase/tests/typed_reminder_live_canary.test.sql --local
          supabase test db supabase/tests/account_owner_policies.test.sql --local
          supabase test db supabase/tests/account_server_data_export.test.sql --local
          supabase test db supabase/tests/account_export_rate_limit.test.sql --local
          supabase test db supabase/tests/stripe_webhook_prerequisites.test.sql --local
          supabase test db supabase/tests/plus_backup_grace_policies.test.sql --local
          supabase test db supabase/tests/legacy_progress_transfer_relay.test.sql --local
          supabase test db supabase/tests/canary_deployed_schema.test.sql --local
          node scripts/test-learner-profile-concurrency.mjs
          REMINDER_TEST_DATABASE_CONTAINER=$(docker ps --filter name=supabase_db_ --format '{{.Names}}') node scripts/diagnostics/test-reminder-e2e.mjs
          REMINDER_TEST_DATABASE_CONTAINER=$(docker ps --filter name=supabase_db_ --format '{{.Names}}') node scripts/diagnostics/test-reminder-quota-concurrency.mjs
          REMINDER_TEST_DATABASE_CONTAINER=$(docker ps --filter name=supabase_db_ --format '{{.Names}}') node scripts/diagnostics/test-reminder-unsubscribe-concurrency.mjs

      - name: Stop isolated Supabase database
        if: always() && needs.scope.outputs.supabase_db == 'true'
        run: supabase stop --no-backup

      - name: Report skipped suites
        if: needs.scope.outputs.contracts != 'true' && needs.scope.outputs.catalogs != 'true' && needs.scope.outputs.supabase != 'true' && needs.scope.outputs.supabase_db != 'true'
        run: echo "Documentation or workflow-only change; no automated test suite required."

  browser:
    needs: [scope, build]
    if: needs.scope.outputs.browser == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: ci-site-normal
          path: _site
      - name: Install Playwright system dependencies
        timeout-minutes: 10
        run: |
          sudo python3 scripts/ci/prefer-ubuntu-archive.py
          apt-config dump Acquire::Retries Acquire::http::Timeout Acquire::https::Timeout
          npx playwright install-deps chromium webkit firefox
      - name: Install Playwright browsers
        # Legacy import acceptance serves this helper from the second origin.
        run: npx playwright install chromium webkit firefox
      - uses: actions/download-artifact@v4
        with:
          name: ci-migration-helper
          path: _legacy_migration_site
      - name: Run selected browser tests
        run: node scripts/run-ci-browser.mjs
        env:
          EDENIA_TEST_NORMAL_PORT: '4173'
          EDENIA_CI_BROWSER_FILES: ${{ needs.scope.outputs.browser_files }}
          EDENIA_CI_ROUTINE: ${{ needs.scope.outputs.full_matrix != 'true' }}
          EDENIA_CI_SHARD: ${{ matrix.shard }}
          EDENIA_CI_SHARDS: '4'
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/results.json
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-diagnostics-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  tiny-swords:
    needs: [scope, build]
    if: needs.scope.outputs.game == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lane: chromium, shard: 1, shards: 4, site: integrated, browsers: chromium }
          - { lane: chromium, shard: 2, shards: 4, site: integrated, browsers: chromium }
          - { lane: chromium, shard: 3, shards: 4, site: integrated, browsers: chromium }
          - { lane: chromium, shard: 4, shards: 4, site: integrated, browsers: chromium }
          - { lane: webkit, shard: 1, shards: 2, site: integrated, browsers: webkit }
          - { lane: webkit, shard: 2, shards: 2, site: integrated, browsers: webkit }
          - { lane: public, shard: 1, shards: 1, site: public, browsers: chromium }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: ci-site-${{ matrix.site }}
          path: _site
      - name: Install Playwright system dependencies
        timeout-minutes: 10
        run: |
          sudo python3 scripts/ci/prefer-ubuntu-archive.py
          apt-config dump Acquire::Retries Acquire::http::Timeout Acquire::https::Timeout
          npx playwright install-deps ${{ matrix.browsers }}
      - name: Install Playwright browsers
        run: npx playwright install ${{ matrix.browsers }}
      - uses: actions/download-artifact@v4
        with:
          name: ci-migration-helper
          path: _legacy_migration_site
      - name: Require selected game persistence and progression flows
        run: node scripts/run-ci-browser.mjs
        env:
          EDENIA_CI_LANE: ${{ matrix.lane }}
          EDENIA_CI_SHARD: ${{ matrix.shard }}
          EDENIA_CI_SHARDS: ${{ matrix.shards }}
          EDENIA_CI_PARALLEL_TESTS: 'true'
          EDENIA_TEST_TINY_SWORDS: ${{ matrix.lane != 'public' }}
          EDENIA_TEST_PUBLIC_ISLAND: ${{ matrix.lane == 'public' }}
          EDENIA_TEST_NORMAL_PORT: '4174'
          EDENIA_TEST_BASE_PATH: '/Edenia/'
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/results.json
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: tiny-swords-${{ matrix.lane }}-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  verify:
    # A narrow manual benchmark must never publish the branch-protection identity.
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.benchmark == 'feed-css' && 'benchmark-verify' || 'verify' }}
    needs: [scope, build, checks, browser, tiny-swords]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all selected suites to pass
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          BUILD_REQUIRED: ${{ needs.scope.outputs.build }}
          BUILD_RESULT: ${{ needs.build.result }}
          BROWSER_REQUIRED: ${{ needs.scope.outputs.browser }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          GAME_REQUIRED: ${{ needs.scope.outputs.game }}
          GAME_RESULT: ${{ needs.tiny-swords.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$SCOPE_RESULT" != 'success' || "$CHECKS_RESULT" != 'success' ]]; then
            exit 1
          fi
          require_selected() {
            case "$1" in
              true) [[ "$2" == 'success' ]] ;;
              false) [[ "$2" == 'skipped' ]] ;;
              *) return 1 ;;
            esac
          }
          require_selected "$BUILD_REQUIRED" "$BUILD_RESULT"
          require_selected "$BROWSER_REQUIRED" "$BROWSER_RESULT"
          require_selected "$GAME_REQUIRED" "$GAME_RESULT"

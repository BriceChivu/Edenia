name: CI
on:
  workflow_dispatch:
    inputs:
      benchmark:
        type: choice
        options: [full, feed-css]
        default: full
permissions:
  contents: read
  actions: read
jobs:
  study-history-repro:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: ci-site-normal
          path: .cache/repro-site
          run-id: 38661783861
          github-token: ${{ github.token }}
      - name: Build current host around the existing unchanged game export
        run: node scripts/build-site.mjs
        env:
          EDENIA_GAME_ARTIFACT_DIR: .cache/repro-site
          EDENIA_VALIDATE_GAME: 'false'
      - run: npx playwright install --with-deps chromium
      - name: Reproduce the unchanged navigation assertion without retries
        run: npx playwright test tests/e2e/issue-464-probe.spec.mjs --project phone-standard --repeat-each 20 --retries 0 --max-failures 1 --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: study-history-464-diagnostics
          path: |
            test-results
            playwright-report
          retention-days: 3

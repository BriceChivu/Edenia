name: CI

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      contracts: ${{ steps.scope.outputs.contracts }}
      browser: ${{ steps.scope.outputs.browser }}
      catalogs: ${{ steps.scope.outputs.catalogs }}
      supabase: ${{ steps.scope.outputs.supabase }}
      supabase_db: ${{ steps.scope.outputs.supabase_db }}
      discovery_catalog: ${{ steps.scope.outputs.discovery_catalog }}
      community_catalog: ${{ steps.scope.outputs.community_catalog }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine test scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail

          run_contracts=false
          run_browser=false
          run_catalogs=false
          run_supabase=false
          run_supabase_db=false
          run_discovery_catalog=false
          run_community_catalog=false

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            run_contracts=true
            run_browser=true
            run_catalogs=true
            run_supabase=true
            run_supabase_db=true
          else
            mapfile -t changed_files < <(git diff --name-only "$BASE_SHA" HEAD)
            printf 'Changed files:\n'
            printf '  %s\n' "${changed_files[@]}"

            for file in "${changed_files[@]}"; do
              case "$file" in
                .github/workflows/ci.yml)
                  run_browser=true
                  run_contracts=true
                  run_supabase=true
                  run_supabase_db=true
                  ;;
                .github/workflows/import-community-channel-catalog.yml|.github/workflows/merge-checked-community-catalog.yml|.github/workflows/merge-checked-discovery-catalog.yml)
                  run_contracts=true
                  run_supabase=true
                  ;;
                .github/workflows/discover-language-channels.yml|scripts/discover-language-channels.mjs|scripts/validate-discovered-channel-catalog.mjs)
                  run_catalogs=true
                  run_contracts=true
                  ;;
                .github/workflows/learner-profile-disaster-backup.yml|.github/workflows/auth-health-monitor.yml)
                  run_contracts=true
                  run_supabase=true
                  run_supabase_db=true
                  ;;
                *.md|docs/*|.github/*)
                  ;;
                data/channel-catalog.discovered.json)
                  run_catalogs=true
                  run_discovery_catalog=true
                  ;;
                data/channel-catalog.candidates.json|data/channel-catalog.community.json)
                  run_catalogs=true
                  run_community_catalog=true
                  ;;
                data/channel-catalog*.json|images/channel-avatars/*)
                  run_catalogs=true
                  ;;
                data/reminder-discovery-channels.json|scripts/validate-reminder-discovery-channels.mjs)
                  run_catalogs=true
                  run_contracts=true
                  ;;
                scripts/validate-channel-catalog-json.mjs|scripts/validate-community-channel-catalog.mjs|scripts/community-channel-catalog-policy.mjs)
                  run_catalogs=true
                  run_contracts=true
                  ;;
                tests/contracts/*)
                  run_contracts=true
                  ;;
                supabase/migrations/*_resolve_divergent_learner_profiles.sql|supabase/migrations/*_choose_divergent_learner_profile.sql|supabase/tests/learner_profile_conflict_resolution.test.sql)
                  run_supabase=true
                  run_supabase_db=true
                  ;;
                supabase/migrations/*_start_over_learner_profile.sql|supabase/tests/learner_profile_start_over.test.sql)
                  run_supabase=true
                  run_supabase_db=true
                  ;;
                supabase/migrations/*_create_first_signed_in_profile.sql|supabase/tests/first_signed_in_profile.test.sql|supabase/migrations/*_synchronize_learner_profile_progress.sql|supabase/tests/learner_profile_progress_sync.test.sql|supabase/migrations/*_recover_missing_learner_profile_heads.sql|supabase/migrations/*_automatic_trusted_predecessor_recovery.sql|supabase/migrations/*_allow_empty_verified_owner_onboarding.sql|supabase/tests/learner_profile_recovery.test.sql|supabase/migrations/*_import_learner_profile_with_rollback.sql|supabase/tests/learner_profile_import.test.sql|supabase/migrations/*_offer_voluntary_accountless_profile_migration.sql|supabase/tests/voluntary_accountless_profile_migration.test.sql|supabase/migrations/*_learner_profile_retention_capacity_maintenance.sql|supabase/tests/learner_profile_retention.test.sql|supabase/migrations/*_add_auth_monitoring_and_operator_recovery.sql|supabase/migrations/*_verify_operator_recovery_from_browser.sql|supabase/tests/auth_operations.test.sql|supabase/migrations/*_add_external_auth_monitor_bridge.sql|supabase/tests/auth_monitoring_freshness.test.sql|supabase/migrations/*_add_reminder_preferences.sql|supabase/migrations/*_replace_schedule_with_email_types.sql|supabase/tests/reminder_preferences_rls.test.sql|supabase/migrations/*_add_reminder_eligibility_snapshots.sql|supabase/tests/reminder_eligibility_snapshots.test.sql|supabase/migrations/*_add_reminder_dispatch_ledger.sql|supabase/tests/reminder_dispatch_ledger.test.sql|supabase/migrations/*_add_reminder_suppression_safety.sql|supabase/tests/reminder_suppression_safety.test.sql|supabase/migrations/*_add_reminder_provider_delivery_state.sql|supabase/tests/reminder_provider_delivery_state.test.sql|supabase/migrations/*_fence_live_reminder_prerequisites.sql|supabase/tests/reminder_live_prerequisites.test.sql|supabase/migrations/*_add_reminder_provider_event_ledger.sql|supabase/migrations/*_add_reminder_operational_metrics.sql|supabase/tests/reminder_provider_event_ledger.test.sql|supabase/migrations/*_add_typed_reminder_dry_run.sql|supabase/tests/typed_reminder_dry_run.test.sql|supabase/migrations/*_add_typed_reminder_live_canary.sql|supabase/tests/typed_reminder_live_canary.test.sql|supabase/migrations/*_optimize_account_owner_policies.sql|supabase/tests/account_owner_policies.test.sql|supabase/migrations/*_add_self_scoped_account_export.sql|supabase/migrations/*_hide_account_export_definer.sql|supabase/tests/account_server_data_export.test.sql|supabase/migrations/*_ensure_account_export_rate_limit.sql|supabase/tests/account_export_rate_limit.test.sql|supabase/migrations/*_ensure_stripe_webhook_prerequisites.sql|supabase/tests/stripe_webhook_prerequisites.test.sql|supabase/migrations/*_reconcile_plus_backup_grace_policies.sql|supabase/tests/plus_backup_grace_policies.test.sql|supabase/migrations/*_legacy_progress_transfer_relay.sql|supabase/tests/legacy_progress_transfer_relay.test.sql)
                  run_supabase=true
                  run_supabase_db=true
                  ;;
                scripts/canary-*.mjs|scripts/rehearse-canary-*.mjs|scripts/watch-canary-execution.mjs|supabase/tests/canary_deployed_schema.test.sql)
                  run_contracts=true
                  run_supabase=true
                  run_supabase_db=true
                  ;;
                supabase/*)
                  run_supabase=true
                  ;;
                *)
                  run_contracts=true
                  run_browser=true
                  ;;
              esac
            done
          fi

          echo "contracts=$run_contracts" >> "$GITHUB_OUTPUT"
          echo "browser=$run_browser" >> "$GITHUB_OUTPUT"
          echo "catalogs=$run_catalogs" >> "$GITHUB_OUTPUT"
          echo "supabase=$run_supabase" >> "$GITHUB_OUTPUT"
          echo "supabase_db=$run_supabase_db" >> "$GITHUB_OUTPUT"
          echo "discovery_catalog=$run_discovery_catalog" >> "$GITHUB_OUTPUT"
          echo "community_catalog=$run_community_catalog" >> "$GITHUB_OUTPUT"

  checks:
    needs: scope
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        if: needs.scope.outputs.contracts == 'true' || needs.scope.outputs.catalogs == 'true' || needs.scope.outputs.supabase == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        if: needs.scope.outputs.contracts == 'true' || needs.scope.outputs.supabase == 'true'
        run: npm ci

      - name: Validate channel catalogs
        if: needs.scope.outputs.catalogs == 'true'
        run: npm run test:catalogs

      - name: Validate unattended discovery delta
        if: needs.scope.outputs.discovery_catalog == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DISCOVERY_MAX_TOTAL_ADDITIONS: ${{ vars.DISCOVERY_MAX_TOTAL_ADDITIONS }}
          DISCOVERY_MIN_SUBSCRIBERS: ${{ vars.DISCOVERY_MIN_SUBSCRIBERS }}
          DISCOVERY_MIN_VIDEOS: ${{ vars.DISCOVERY_MIN_VIDEOS }}
        run: npm run test:catalogs:discovery -- --base-ref "$BASE_SHA"

      - name: Validate unattended community delta
        if: needs.scope.outputs.community_catalog == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          COMMUNITY_CATALOG_MAX_PROMOTIONS: ${{ vars.COMMUNITY_CATALOG_MAX_PROMOTIONS }}
        run: npm run test:catalogs:community -- --base-ref "$BASE_SHA"

      - name: Build and run contract tests
        if: needs.scope.outputs.contracts == 'true'
        run: npm run build && npm run test:contracts

      - name: Run Supabase backend tests
        if: needs.scope.outputs.supabase == 'true'
        run: npm run test:supabase

      - name: Set up Deno for Edge Function checks
        if: needs.scope.outputs.supabase == 'true'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.4

      - name: Type-check Auth monitor Edge Function
        if: needs.scope.outputs.supabase == 'true'
        run: npm run test:auth-monitor-function

      - name: Type-check reminder Edge Function
        if: needs.scope.outputs.supabase == 'true'
        run: npm run test:reminder-function

      - name: Type-check account export Edge Function
        if: needs.scope.outputs.supabase == 'true'
        run: npm run test:account-export-function

      - name: Type-check legacy progress relay Edge Functions
        if: needs.scope.outputs.supabase == 'true'
        run: npm run test:legacy-progress-relay-function

      - name: Set up Supabase CLI
        if: needs.scope.outputs.supabase_db == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Start isolated Supabase database
        if: needs.scope.outputs.supabase_db == 'true'
        run: supabase start

      - name: Verify database safety
        if: needs.scope.outputs.supabase_db == 'true'
        run: |
          supabase test db supabase/tests/first_signed_in_profile.test.sql --local
          supabase test db supabase/tests/learner_profile_progress_sync.test.sql --local
          supabase test db supabase/tests/learner_profile_conflict_resolution.test.sql --local
          supabase test db supabase/tests/voluntary_accountless_profile_migration.test.sql --local
          supabase test db supabase/tests/learner_profile_recovery.test.sql --local
          supabase test db supabase/tests/learner_profile_import.test.sql --local
          supabase test db supabase/tests/learner_profile_start_over.test.sql --local
          supabase test db supabase/tests/learner_profile_retention.test.sql --local
          supabase test db supabase/tests/auth_operations.test.sql --local
          supabase test db supabase/tests/auth_monitoring_freshness.test.sql --local
          supabase test db supabase/tests/reminder_preferences_rls.test.sql --local
          supabase test db supabase/tests/reminder_eligibility_snapshots.test.sql --local
          supabase test db supabase/tests/reminder_dispatch_ledger.test.sql --local
          supabase test db supabase/tests/reminder_suppression_safety.test.sql --local
          supabase test db supabase/tests/reminder_provider_delivery_state.test.sql --local
          supabase test db supabase/tests/reminder_live_prerequisites.test.sql --local
          supabase test db supabase/tests/reminder_provider_event_ledger.test.sql --local
          supabase test db supabase/tests/typed_reminder_dry_run.test.sql --local
          supabase test db supabase/tests/typed_reminder_live_canary.test.sql --local
          supabase test db supabase/tests/account_owner_policies.test.sql --local
          supabase test db supabase/tests/account_server_data_export.test.sql --local
          supabase test db supabase/tests/account_export_rate_limit.test.sql --local
          supabase test db supabase/tests/stripe_webhook_prerequisites.test.sql --local
          supabase test db supabase/tests/plus_backup_grace_policies.test.sql --local
          supabase test db supabase/tests/legacy_progress_transfer_relay.test.sql --local
          supabase test db supabase/tests/canary_deployed_schema.test.sql --local
          node scripts/test-learner-profile-concurrency.mjs

      - name: Stop isolated Supabase database
        if: always() && needs.scope.outputs.supabase_db == 'true'
        run: supabase stop --no-backup

      - name: Report skipped suites
        if: needs.scope.outputs.contracts != 'true' && needs.scope.outputs.catalogs != 'true' && needs.scope.outputs.supabase != 'true' && needs.scope.outputs.supabase_db != 'true'
        run: echo "Documentation or workflow-only change; no automated test suite required."

  browser:
    needs: scope
    if: needs.scope.outputs.browser == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        # Pair the heavier desktop preservation shards with lighter general shards.
        include:
          - shard: 1
            preservationShard: 4
          - shard: 2
            preservationShard: 3
          - shard: 3
            preservationShard: 2
          - shard: 4
            preservationShard: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build browser test site
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run browser tests
        id: general
        env:
          EDENIA_TEST_NORMAL_PORT: 4173
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/general
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/general/results.json
        run: npx playwright test --shard=${{ matrix.shard }}/4 --grep-invert='preservation-smoke\.spec\.mjs' --output=test-results/general --reporter=dot,html,json

      - name: Run preservation browser tests
        if: ${{ !cancelled() && (steps.general.outcome == 'success' || steps.general.outcome == 'failure') }}
        env:
          EDENIA_TEST_NORMAL_PORT: 4173
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/preservation
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/preservation/results.json
        run: npx playwright test preservation-smoke.spec.mjs --shard=${{ matrix.preservationShard }}/4 --output=test-results/preservation --reporter=dot,html,json

      - name: Upload Playwright diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  pixel-town:
    needs: scope
    if: needs.scope.outputs.browser == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          EDENIA_PIXEL_TOWN_ENABLED: 'true'
      - run: node tools/pixel-town/verify-art.mjs
      - run: npx playwright test tests/e2e/pixel-town.spec.mjs --project=desktop-standard --project=phone-standard
        env:
          EDENIA_PIXEL_TOWN_ENABLED: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pixel-town-evidence
          path: |
            docs/experiments/pixel-town/evidence/
            test-results/

  # Keep the branch-protection check stable and reject failed/cancelled jobs.
  verify:
    needs: [scope, checks, browser, pixel-town]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all selected suites to pass
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          BROWSER_REQUIRED: ${{ needs.scope.outputs.browser }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          PIXEL_TOWN_RESULT: ${{ needs.pixel-town.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$SCOPE_RESULT" != "success" || "$CHECKS_RESULT" != "success" ]]; then
            exit 1
          fi
          case "$BROWSER_REQUIRED" in
            true) [[ "$BROWSER_RESULT" == "success" && "$PIXEL_TOWN_RESULT" == "success" ]] ;;
            false) [[ "$BROWSER_RESULT" == "skipped" && "$PIXEL_TOWN_RESULT" == "skipped" ]] ;;
            *) exit 1 ;;
          esac

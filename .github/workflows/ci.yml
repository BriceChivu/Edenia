name: CI

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine test scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail

          run_contracts=false
          run_browser=false
          run_catalogs=false
          run_supabase=false
          run_discovery_catalog=false
          run_community_catalog=false

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            run_contracts=true
            run_browser=true
            run_catalogs=true
            run_supabase=true
          else
            mapfile -t changed_files < <(git diff --name-only "$BASE_SHA" HEAD)
            printf 'Changed files:\n'
            printf '  %s\n' "${changed_files[@]}"

            for file in "${changed_files[@]}"; do
              case "$file" in
                .github/workflows/ci.yml|.github/workflows/import-community-channel-catalog.yml|.github/workflows/merge-checked-community-catalog.yml|.github/workflows/merge-checked-discovery-catalog.yml)
                  run_contracts=true
                  run_supabase=true
                  ;;
                *.md|docs/*|.github/*)
                  ;;
                data/channel-catalog.discovered.json)
                  run_catalogs=true
                  run_discovery_catalog=true
                  ;;
                data/channel-catalog.candidates.json|data/channel-catalog.community.json)
                  run_catalogs=true
                  run_community_catalog=true
                  ;;
                data/channel-catalog*.json|images/channel-avatars/*)
                  run_catalogs=true
                  ;;
                scripts/validate-channel-catalog-json.mjs|scripts/validate-community-channel-catalog.mjs|scripts/community-channel-catalog-policy.mjs)
                  run_catalogs=true
                  run_contracts=true
                  ;;
                tests/contracts/*)
                  run_contracts=true
                  ;;
                supabase/*)
                  run_supabase=true
                  ;;
                *)
                  run_contracts=true
                  run_browser=true
                  ;;
              esac
            done
          fi

          echo "contracts=$run_contracts" >> "$GITHUB_OUTPUT"
          echo "browser=$run_browser" >> "$GITHUB_OUTPUT"
          echo "catalogs=$run_catalogs" >> "$GITHUB_OUTPUT"
          echo "supabase=$run_supabase" >> "$GITHUB_OUTPUT"
          echo "discovery_catalog=$run_discovery_catalog" >> "$GITHUB_OUTPUT"
          echo "community_catalog=$run_community_catalog" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.scope.outputs.contracts == 'true' || steps.scope.outputs.catalogs == 'true' || steps.scope.outputs.supabase == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        if: steps.scope.outputs.contracts == 'true'
        run: npm ci

      - name: Validate channel catalogs
        if: steps.scope.outputs.catalogs == 'true'
        run: npm run test:catalogs

      - name: Validate unattended discovery delta
        if: steps.scope.outputs.discovery_catalog == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DISCOVERY_MAX_TOTAL_ADDITIONS: ${{ vars.DISCOVERY_MAX_TOTAL_ADDITIONS }}
          DISCOVERY_MIN_SUBSCRIBERS: ${{ vars.DISCOVERY_MIN_SUBSCRIBERS }}
          DISCOVERY_MIN_VIDEOS: ${{ vars.DISCOVERY_MIN_VIDEOS }}
        run: npm run test:catalogs:discovery -- --base-ref "$BASE_SHA"

      - name: Validate unattended community delta
        if: steps.scope.outputs.community_catalog == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          COMMUNITY_CATALOG_MAX_PROMOTIONS: ${{ vars.COMMUNITY_CATALOG_MAX_PROMOTIONS }}
        run: npm run test:catalogs:community -- --base-ref "$BASE_SHA"

      - name: Build and run contract tests
        if: steps.scope.outputs.contracts == 'true'
        run: npm run build && npm run test:contracts

      - name: Run Supabase backend tests
        if: steps.scope.outputs.supabase == 'true'
        run: npm run test:supabase

      - name: Install Playwright browsers
        if: steps.scope.outputs.browser == 'true'
        run: npx playwright install --with-deps chromium webkit

      - name: Run browser tests
        if: steps.scope.outputs.browser == 'true'
        env:
          EDENIA_TEST_NORMAL_PORT: 4173
        run: npx playwright test

      - name: Report skipped suites
        if: steps.scope.outputs.contracts != 'true' && steps.scope.outputs.catalogs != 'true' && steps.scope.outputs.supabase != 'true'
        run: echo "Documentation or workflow-only change; no automated test suite required."

      - name: Upload Playwright diagnostics
        if: failure() && steps.scope.outputs.browser == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

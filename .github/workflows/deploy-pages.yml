name: Deploy GitHub Pages

on:
  push:
    branches:
      - public-main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html app.js style.css Edenia_favicon_round.png _site/
          cp -R images _site/images

      - name: Generate public runtime config
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "Missing required repository secret: YOUTUBE_API_KEY" >&2
            exit 1
          fi

          node -e "const fs = require('fs'); const key = process.env.YOUTUBE_API_KEY; fs.writeFileSync('_site/config.local.js', 'window.EDENIA_CONFIG = ' + JSON.stringify({ youtubeApiKey: key }, null, 2) + '\\n')"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

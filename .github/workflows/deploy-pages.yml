name: Deploy GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Godot
        uses: ./.github/actions/setup-godot

      - name: Restore previous game releases for older open tabs
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/restore-tiny-swords-history.mjs

      - name: Build static site
        env:
          # Required CI owns game regression tests; deployment imports/exports only.
          EDENIA_VALIDATE_GAME: 'false'
          EDENIA_PREVIOUS_GAME_ARTIFACT_DIR: .cache/previous-tiny-swords
          # Public page release is explicit; the engine can be disabled separately.
          EDENIA_TINY_SWORDS_PUBLIC_ENABLED: ${{ vars.EDENIA_TINY_SWORDS_PUBLIC_ENABLED || 'false' }}
          EDENIA_TINY_SWORDS_ENABLED: ${{ vars.EDENIA_TINY_SWORDS_ENABLED || 'false' }}
          EDENIA_FREE_PLUS_ENABLED: ${{ vars.EDENIA_FREE_PLUS_ENABLED }}
          EDENIA_PLUS_CHECKOUT_ENABLED: ${{ vars.EDENIA_PLUS_CHECKOUT_ENABLED }}
          # Account features are paused; resumption requires a reviewed change.
          EDENIA_ACCOUNT_FEATURES_ROLLOUT: 'off'
          # The trial flag applies only to the isolated internal_test=1 route.
          EDENIA_AUTH_TRIAL_ENABLED: ${{ vars.EDENIA_AUTH_TRIAL_ENABLED || 'false' }}
          # Enable after compatible current-record RPCs are deployed and verified.
          EDENIA_LEARNER_PROFILE_RECORD_SYNC_ENABLED: ${{ vars.EDENIA_LEARNER_PROFILE_RECORD_SYNC_ENABLED || 'false' }}
          EDENIA_ACCOUNTLESS_PROFILE_FINAL_CUTOVER_AT: ${{ vars.EDENIA_ACCOUNTLESS_PROFILE_FINAL_CUTOVER_AT }}
          EDENIA_EMERGENCY_ACCOUNTLESS_ROLLBACK_ENABLED: ${{ vars.EDENIA_EMERGENCY_ACCOUNTLESS_ROLLBACK_ENABLED }}
          EDENIA_GOOGLE_SIGN_IN_MODE: ${{ vars.EDENIA_GOOGLE_SIGN_IN_MODE }}
          EDENIA_GOOGLE_IDENTITY_CLIENT_ID: ${{ vars.EDENIA_GOOGLE_IDENTITY_CLIENT_ID }}
          EDENIA_TURNSTILE_SITE_KEY: ${{ vars.EDENIA_TURNSTILE_SITE_KEY }}
          EDENIA_STUDY_GUIDANCE_ENABLED: ${{ vars.EDENIA_STUDY_GUIDANCE_ENABLED }}
          EDENIA_INDEXED_DB_PROFILE_ENABLED: ${{ vars.EDENIA_INDEXED_DB_PROFILE_ENABLED }}
          EDENIA_INDEXED_DB_BACKUPS_ENABLED: ${{ vars.EDENIA_INDEXED_DB_BACKUPS_ENABLED }}
          EDENIA_INDEXED_DB_BACKUP_CLEANUP_ENABLED: ${{ vars.EDENIA_INDEXED_DB_BACKUP_CLEANUP_ENABLED }}
          EDENIA_LEGACY_PROGRESS_MIGRATION_ENABLED: ${{ vars.EDENIA_LEGACY_PROGRESS_MIGRATION_ENABLED }}
          EDENIA_LEARNER_PROFILE_LIFECYCLE_ENABLED: 'false'
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: npm run build:production

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Retain complete game releases for the next deployment
        uses: actions/upload-artifact@v4
        with:
          name: tiny-swords-compatibility
          retention-days: 8
          path: |
            _site/tiny-swords-game/
            _site/tiny-swords-engine/
            _site/tiny-swords-decoder/
            _site/tiny-swords-current.json
            _site/tiny-swords-history.json

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

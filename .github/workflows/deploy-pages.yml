name: Deploy GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Godot
        uses: ./.github/actions/setup-godot

      - name: Build static site
        env:
          # Optional tester release only; ordinary visits always retain production.
          EDENIA_TINY_SWORDS_ENABLED: ${{ vars.EDENIA_TINY_SWORDS_ENABLED || 'false' }}
          # Retained mode 1 renderer, independent of the Tiny Swords tester mode.
          EDENIA_PIXEL_TOWN_ENABLED: ${{ vars.EDENIA_PIXEL_TOWN_ENABLED }}
          EDENIA_FREE_PLUS_ENABLED: ${{ vars.EDENIA_FREE_PLUS_ENABLED }}
          EDENIA_PLUS_CHECKOUT_ENABLED: ${{ vars.EDENIA_PLUS_CHECKOUT_ENABLED }}
          # Internal Auth is paused; resumption requires a reviewed change.
          EDENIA_ACCOUNT_FEATURES_ROLLOUT: 'off'
          EDENIA_ACCOUNTLESS_PROFILE_FINAL_CUTOVER_AT: ${{ vars.EDENIA_ACCOUNTLESS_PROFILE_FINAL_CUTOVER_AT }}
          EDENIA_EMERGENCY_ACCOUNTLESS_ROLLBACK_ENABLED: ${{ vars.EDENIA_EMERGENCY_ACCOUNTLESS_ROLLBACK_ENABLED }}
          EDENIA_GOOGLE_SIGN_IN_MODE: ${{ vars.EDENIA_GOOGLE_SIGN_IN_MODE }}
          EDENIA_GOOGLE_IDENTITY_CLIENT_ID: ${{ vars.EDENIA_GOOGLE_IDENTITY_CLIENT_ID }}
          EDENIA_TURNSTILE_SITE_KEY: ${{ vars.EDENIA_TURNSTILE_SITE_KEY }}
          EDENIA_STUDY_GUIDANCE_ENABLED: ${{ vars.EDENIA_STUDY_GUIDANCE_ENABLED }}
          EDENIA_INDEXED_DB_BACKUPS_ENABLED: ${{ vars.EDENIA_INDEXED_DB_BACKUPS_ENABLED }}
          EDENIA_INDEXED_DB_BACKUP_CLEANUP_ENABLED: ${{ vars.EDENIA_INDEXED_DB_BACKUP_CLEANUP_ENABLED }}
          EDENIA_LEGACY_PROGRESS_MIGRATION_ENABLED: ${{ vars.EDENIA_LEGACY_PROGRESS_MIGRATION_ENABLED }}
          EDENIA_LEARNER_PROFILE_LIFECYCLE_ENABLED: 'false'
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: npm run build:production

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

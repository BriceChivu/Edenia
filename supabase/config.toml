
[auth]
# Keep production Auth URLs explicit so `supabase config push` cannot replace
# them with the CLI's localhost defaults. Do not add wildcard redirects.
site_url = "https://www.edenia.study/"
additional_redirect_urls = [
  "https://bricechivu.github.io/Edenia/?internal_test=1&account=1",
  "http://localhost:8000/?internal_test=1&account=1",
  "https://www.edenia.study/?internal_test=1&account=1",
]

[auth.email]
enable_confirmations = true
max_frequency = "1m"
otp_length = 6

[auth.email.template.confirmation]
subject = '{{ if eq .Data.edenia_auth_locale "es" }}Tu código de acceso a Edenia{{ else if eq .Data.edenia_auth_locale "fr" }}Votre code de connexion Edenia{{ else if eq .Data.edenia_auth_locale "zh-Hans" }}你的 Edenia 登录验证码{{ else if eq .Data.edenia_auth_locale "zh-Hant" }}你的 Edenia 登入驗證碼{{ else if eq .Data.edenia_auth_locale "en" }}Your Edenia sign-in code{{ else }}Edenia verification code · Código de verificación · Code de vérification · 验证码 · 驗證碼{{ end }}'
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.magic_link]
subject = '{{ if eq .Data.edenia_auth_locale "es" }}Tu código de acceso a Edenia{{ else if eq .Data.edenia_auth_locale "fr" }}Votre code de connexion Edenia{{ else if eq .Data.edenia_auth_locale "zh-Hans" }}你的 Edenia 登录验证码{{ else if eq .Data.edenia_auth_locale "zh-Hant" }}你的 Edenia 登入驗證碼{{ else if eq .Data.edenia_auth_locale "en" }}Your Edenia sign-in code{{ else }}Edenia verification code · Código de verificación · Code de vérification · 验证码 · 驗證碼{{ end }}'
content_path = "./supabase/templates/magic_link.html"

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[storage.vector]
# Vector buckets require a paid plan and are intentionally disabled.
enabled = false

[functions.create-checkout-session]
enabled = true
verify_jwt = true
import_map = "./functions/create-checkout-session/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/create-checkout-session/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/create-checkout-session/*.html" ]

[functions.get-plus-offer]
enabled = true
verify_jwt = false
import_map = "./functions/get-plus-offer/deno.json"
entrypoint = "./functions/get-plus-offer/index.ts"

[functions.create-billing-portal]
enabled = true
verify_jwt = true
import_map = "./functions/create-billing-portal/deno.json"
entrypoint = "./functions/create-billing-portal/index.ts"

[functions.stripe-webhook]
enabled = true
verify_jwt = false
import_map = "./functions/stripe-webhook/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/stripe-webhook/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/stripe-webhook/*.html" ]

[functions.link-checkout-session]
enabled = true
verify_jwt = false
import_map = "./functions/link-checkout-session/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/link-checkout-session/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/link-checkout-session/*.html" ]

[functions.dispatch-study-reminders]
enabled = true
# Service-to-service calls use a rotatable secret key in the apikey header.
# The handler validates the named key with @supabase/server.
verify_jwt = false
import_map = "./functions/dispatch-study-reminders/deno.json"
entrypoint = "./functions/dispatch-study-reminders/index.ts"

[functions.unsubscribe-study-reminders]
enabled = true
# The opaque single-use capability authorizes only this unsubscribe action.
# GET is read-only; POST consumes the capability through one service-only RPC.
verify_jwt = false
import_map = "./functions/unsubscribe-study-reminders/deno.json"
entrypoint = "./functions/unsubscribe-study-reminders/index.ts"

[functions.resend-reminder-webhook]
enabled = true
# Provider requests are authenticated with the raw-body Svix signature. With no
# RESEND_WEBHOOK_SECRET configured, every POST fails closed before reading it.
verify_jwt = false
import_map = "./functions/resend-reminder-webhook/deno.json"
entrypoint = "./functions/resend-reminder-webhook/index.ts"

[functions.export-account-data]
enabled = true
# The platform verifies the signed-in user's JWT before the handler rechecks it
# and passes only that verified UUID to the service-only database bridge.
verify_jwt = true
import_map = "./functions/export-account-data/deno.json"
entrypoint = "./functions/export-account-data/index.ts"

[functions.create-legacy-progress-transfer]
enabled = true
# The server wrapper validates the named browser publishable key before the
# handler's exact-origin policy and disabled database acceptance switch.
verify_jwt = false
import_map = "./functions/create-legacy-progress-transfer/deno.json"
entrypoint = "./functions/create-legacy-progress-transfer/index.ts"

[functions.consume-legacy-progress-transfer]
enabled = true
# The server wrapper validates the named browser publishable key. A random
# fragment-only capability then authorizes one claim and completion; the
# database consumption switch starts disabled independently of acceptance.
verify_jwt = false
import_map = "./functions/consume-legacy-progress-transfer/deno.json"
entrypoint = "./functions/consume-legacy-progress-transfer/index.ts"

[functions.auth-health-monitor]
enabled = true
# The handler verifies a dedicated bearer capability before any probe or read.
verify_jwt = false
import_map = "./functions/auth-health-monitor/deno.json"
entrypoint = "./functions/auth-health-monitor/index.ts"
